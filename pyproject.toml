[project]
name = "giffy"
version = "0.1.1"
description = "Fast wiggle GIFs that keep the photos' full size and quality"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=9.4"]

[project.scripts]
giffy = "giffy:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=74"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.setuptools.ext-modules]]
name = "giffy._giffy"
sources = ["src/giffy/_giffy.c"]
extra-compile-args = ["-O3", "-std=c11", "-Wall", "-Wextra", "-Wno-unused-parameter"]
libraries = ["m"]

[tool.pytest.ini_options]
testpaths = ["tests"]
